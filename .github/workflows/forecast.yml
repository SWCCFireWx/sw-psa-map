name: Forecast

on:
  schedule:
    - cron: "40 13 * * *"    # 6:40 am MST, after the 06Z global / 12Z hourly runs
    - cron: "40 19 * * *"    # 12:40 pm MST, picks up 12Z GFS/IFS
  workflow_dispatch:
    inputs:
      models:
        description: "Models to run (comma list, blank = all)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["data/**", "config/**"]   # edits to fuels, overrides, discussion or thresholds re-color the map without new model runs

permissions:
  contents: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  psa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install shapely
      - name: Download PSA boundaries if missing
        run: |
          if [ ! -s docs/psa.geojson ]; then python scripts/psa_pipeline.py fetch-psa --out docs/psa.geojson; fi
      - uses: actions/upload-artifact@v4
        with: { name: psa, path: docs/psa.geojson }

  models:
    if: github.event_name != 'push'
    needs: psa
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        model: [HRRR, RAP, NAMNEST, RRFS, NBM, GFS, GEFS, IFS, AIFS]
    steps:
      - name: Skip models not requested
        id: want
        run: |
          list="${{ github.event.inputs.models }}"
          if [ -z "$list" ] || echo ",${list^^}," | grep -q ",${{ matrix.model }},"; then echo "run=1" >> $GITHUB_OUTPUT; fi
      - uses: actions/checkout@v4
        if: steps.want.outputs.run
      - uses: actions/setup-python@v5
        if: steps.want.outputs.run
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements.txt }
      - if: steps.want.outputs.run
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libeccodes-dev
          pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        if: steps.want.outputs.run
        with: { name: psa, path: docs }
      - name: Run ${{ matrix.model }}
        if: steps.want.outputs.run
        run: python scripts/psa_pipeline.py model --model ${{ matrix.model }} --out partials/${{ matrix.model }}.csv
      - uses: actions/upload-artifact@v4
        if: steps.want.outputs.run
        with:
          name: partial-${{ matrix.model }}
          path: partials/${{ matrix.model }}.csv
          if-no-files-found: ignore

  fems:
    if: github.event_name != 'push'
    needs: psa
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas numpy shapely
      - uses: actions/download-artifact@v4
        with: { name: psa, path: docs }
      - name: Pull ERC, BI and fuel moistures from FEMS
        run: python scripts/psa_pipeline.py fems
      - uses: actions/upload-artifact@v4
        with:
          name: fems
          path: |
            docs/fems.csv
            docs/fems_stations.json
          if-no-files-found: ignore

  blend:
    needs: [psa, models, fems]
    if: always() && needs.psa.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas numpy shapely
      - uses: actions/download-artifact@v4
        with: { name: psa, path: docs }
      - uses: actions/download-artifact@v4
        if: github.event_name != 'push'
        with: { pattern: partial-*, path: partials, merge-multiple: true }
      - uses: actions/download-artifact@v4
        if: github.event_name != 'push'
        continue-on-error: true
        with: { name: fems, path: docs }
      - name: Blend, classify, write outlook
        run: python scripts/psa_pipeline.py blend --partials partials
      - name: Commit updated map data
        run: |
          git config user.name "psa-forecast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Forecast update $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q && git push
