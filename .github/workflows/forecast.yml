name: Forecast

on:
  schedule:
    # GitHub schedules are in UTC and do not follow daylight saving.
    - cron: "45 12 * * *"    # 5:45 am MST (6:45 am MDT): 06Z GFS/GEFS/NAM, 00Z ECMWF, latest hourly models, FEMS
    - cron: "30 6 * * *"     # 11:30 pm MST (12:30 am MDT): 00Z HRRR/NAM/GFS/GEFS, ECMWF 00Z if posted (else 12Z), today's 1300 FEMS obs + new NFDRS forecast
  workflow_dispatch:
    inputs:
      models:
        description: "Models to run (comma list, blank = all)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["data/**", "config/**"]   # edits to overrides, notes or thresholds trigger a fresh run (about 5 minutes)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  psa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas numpy shapely
      - name: Refresh PSA boundaries (keeps the last good copy if NWCG is down)
        run: |
          python scripts/psa_pipeline.py fetch-psa --out docs/psa.new.geojson && mv docs/psa.new.geojson docs/psa.geojson || test -s docs/psa.geojson
      - uses: actions/upload-artifact@v4
        with: { name: psa, path: docs/psa.geojson }

  models:
    needs: psa
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        model: [HRRR, RAP, NAMNEST, NBM, GFS, GEFS, IFS, AIFS]
    steps:
      - name: Skip models not requested
        id: want
        run: |
          list="${{ github.event.inputs.models }}"
          if [ -z "$list" ] || echo ",${list^^}," | grep -q ",${{ matrix.model }},"; then echo "run=1" >> $GITHUB_OUTPUT; fi
      - uses: actions/checkout@v4
        if: steps.want.outputs.run
      - uses: actions/setup-python@v5
        if: steps.want.outputs.run
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements.txt }
      - if: steps.want.outputs.run
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libeccodes-dev
          pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        if: steps.want.outputs.run
        with: { name: psa, path: docs }
      - name: Run ${{ matrix.model }}
        if: steps.want.outputs.run
        run: python scripts/psa_pipeline.py model --model ${{ matrix.model }} --out partials/${{ matrix.model }}.csv
      - uses: actions/upload-artifact@v4
        if: steps.want.outputs.run
        with:
          name: partial-${{ matrix.model }}
          path: partials/${{ matrix.model }}*
          if-no-files-found: ignore

  fems:
    needs: psa
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas numpy shapely
      - uses: actions/download-artifact@v4
        with: { name: psa, path: docs }
      - name: Pull ERC, BI and fuel moistures from FEMS
        continue-on-error: true
        run: python scripts/psa_pipeline.py fems
      - name: Count active wildfires from NIFC WFIGS
        continue-on-error: true
        run: python scripts/psa_pipeline.py fires
      - uses: actions/upload-artifact@v4
        with:
          name: fems
          path: |
            docs/fems.csv
            docs/fems_stations.json
            docs/fires.json
          if-no-files-found: ignore

  blend:
    needs: [psa, models, fems]
    if: always() && needs.psa.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas numpy shapely matplotlib
      - uses: actions/download-artifact@v4
        with: { name: psa, path: docs }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { pattern: partial-*, path: partials, merge-multiple: true }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: fems, path: docs }
      - name: Blend, classify, write outlook
        run: python scripts/psa_pipeline.py blend --partials partials
      - name: Draw discussion maps
        continue-on-error: true
        run: python scripts/psa_pipeline.py maps
      - name: Commit forecast data (maps are published, not committed)
        run: |
          git config user.name "psa-forecast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/*.json docs/*.csv docs/*.geojson docs/index.html 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Forecast update $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q && git push
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }

  deploy:
    needs: blend
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
