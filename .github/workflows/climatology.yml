name: Climatology

# The FEMS climatology (BI/ERC percentiles, day-of-year normals, peak-season
# temperatures) is now checked and, when needed, rebuilt at the start of every
# Forecast run, so it is always current before the map is drawn.
#
# This workflow is only a manual button: it starts a Forecast run that rebuilds
# the climatology even if it is current.
on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Start a Forecast run that rebuilds the climatology
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run forecast.yml --repo "${{ github.repository }}" --ref main -f rebuild_climo=yes
